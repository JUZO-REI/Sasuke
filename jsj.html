<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单计算机</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #dfeeff;
      font-family: Arial, sans-serif;
    }

    .calculator {
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      color: #333;
      text-align: center;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      gap: 12px;
      justify-content: center;
    }

    button {
      width: 80px;
      height: 50px;
      border: none;
      border-radius: 8px;
      background-color: #f5f5f5;
      color: #333;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h1>我是计算机</h1>
    <div id="display" style="background: #fff; padding: 10px; margin-bottom: 10px; height: 40px; font-size: 24px; text-align: right; border-radius: 8px;">
    0
    </div>
    <div class="buttons">
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>-</button>
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>*</button>
      <button>0</button>
      <button>.</button>
      <button>C</button>
      <button>/</button>
      <button>=</button>
    </div>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
